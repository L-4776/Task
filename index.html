<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест JavaScript</title>
</head>
<body>

    <h2>Проверка связи HTML и JS</h2>
    
    <!-- Поле ввода и кнопка -->
    <input type="text" id="myInput" placeholder="Введите текст...">
    <button id="myButton">Нажми на меня</button>
    
    <!-- Сюда выведется результат -->
    <p id="myOutput" style="font-weight: bold; color: blue;"></p>

    <!-- Подключаем скрипт в самом низу страницы -->
    <script src="script.js"></script>
</body>
</html>
